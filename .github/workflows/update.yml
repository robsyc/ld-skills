name: Update specs

# Rebuilds the skill's reference snapshots from the live specification
# sources and commits the result. Undated /TR/ URLs follow the latest
# published edition, so this picks up new versions automatically.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-specs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync

      - name: Rebuild reference snapshots
        run: uv run ld-skills build --refresh

      # GITHUB_TOKEN pushes do not trigger the CI workflow, so validate here
      - name: Registry check
        run: uv run ld-skills check

      - name: Commit updated snapshots
        run: |
          git config user.name "ld-skills-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git add skills/ registry/
          git commit -m "chore: refresh spec snapshots ($(date -u +%F))"
          git push
